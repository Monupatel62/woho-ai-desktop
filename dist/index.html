<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="WoHo AI Desktop">
  <title>WoHo AI</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Segoe UI, sans-serif; }
    body { margin: 0; background: #0b0d12; color: #eef1f6; }
    main { min-height: 100vh; display: grid; grid-template-columns: 220px 1fr; }
    aside { padding: 24px; border-right: 1px solid #242936; }
    section { padding: 32px; max-width: 1000px; }
    nav { display: grid; gap: 8px; margin-top: 24px; }
    button { background: transparent; color: inherit; border: 1px solid #2c3240; border-radius: 8px; padding: 10px 12px; text-align: left; }
    .hero { margin-top: 18vh; }
    .muted { color: #9aa3b2; }
    code { color: #c8d1ff; }
  </style>
</head>
<body>
  <main>
    <aside>
      <strong>WoHo AI</strong>
      <nav>
        <button>Chats</button>
        <button>Projects</button>
        <button>Files</button>
        <button>Tools</button>
        <button>Agents</button>
        <button>Models</button>
      </nav>
    </aside>
    <section>
      <div class="hero">
        <h1>WoHo AI Desktop</h1>
        <p class="muted">Local-first AI agent desktop shell.</p>
        <p>Agent runtime, local models, tools, memory and secure project workspaces will connect through the desktop bridge.</p>
        <p class="muted">Foundation status: <code>ready</code></p>
      </div>
    </section>
  </main>
</body>
</html>
