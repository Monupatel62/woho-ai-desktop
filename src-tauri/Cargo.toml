[package]
name = "woho-ai-desktop"
version = "0.1.0"
description = "WoHo AI Desktop"
authors = ["WoHo"]
edition = "2021"

[lib]
name = "woho_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1" }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.12.1" }
