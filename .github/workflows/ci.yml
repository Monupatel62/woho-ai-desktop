name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          timeout 5m sudo apt-get update
          timeout 5m sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  windows-production:
    runs-on: windows-latest
    env:
      LLAMA_CPP_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11430/llama-b11430-bin-win-cpu-x64.zip
      LLAMA_CPP_SHA256: b608455b0109793f774537d63d15d4cf2098ddbc5b200ebc9a648e1d85369666
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --no-frozen-lockfile
      - name: Build production agent sidecar
        run: pnpm build:agent-sidecar
      - name: Prepare verified llama.cpp resource
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "llama-cpu.zip"
          $extract = Join-Path $env:RUNNER_TEMP "llama-extract"
          $resource = Join-Path $env:GITHUB_WORKSPACE "src-tauri/resources/llama"
          New-Item -ItemType Directory -Force -Path $extract,$resource | Out-Null
          Invoke-WebRequest -Uri $env:LLAMA_CPP_URL -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:LLAMA_CPP_SHA256) {
            throw "llama.cpp SHA-256 mismatch"
          }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $cli = Get-ChildItem -Path $extract -Filter "llama-cli.exe" -File -Recurse | Select-Object -First 1
          if ($null -eq $cli) {
            throw "llama-cli.exe missing"
          }
          Copy-Item -Path (Join-Path $cli.Directory.FullName "*") -Destination $resource -Recurse -Force
      - name: Compile production Tauri application
        run: pnpm exec tauri build --no-bundle
      - name: Build Windows installers
        run: pnpm exec tauri build
      - name: Verify Windows installer artifacts
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue
          if ($msi.Count -lt 1) {
            throw "MSI installer was not generated"
          }
          if ($exe.Count -lt 1) {
            throw "NSIS EXE installer was not generated"
          }
          Write-Host "MSI installer(s):"
          $msi | ForEach-Object { Write-Host $_.FullName }
          Write-Host "NSIS EXE installer(s):"
          $exe | ForEach-Object { Write-Host $_.FullName }
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: woho-ai-windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
